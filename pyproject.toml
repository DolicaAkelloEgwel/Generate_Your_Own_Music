[project]
name = "generate-your-own-music"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.10.19"
dependencies = [
    "tensorflow<2.11",
    "keras>=2.10.0,<3",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "isort>=7.0.0",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.pypi-dependencies]
generate-your-own-music = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
pygame = ">=2.6.1,<3"
music21 = ">=9.9.2,<10"
numpy = "<2"
cudatoolkit = "11.2.*"
cudnn = "8.1.0.*"
